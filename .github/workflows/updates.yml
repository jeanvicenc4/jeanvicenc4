name: Refresh product updates feed

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Fetch public product changelogs
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeanvicenc4/KAZER/main/CHANGELOG.md \
            --output /tmp/kazer-changelog.md
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeanvicenc4/Kzcoder/main/CHANGELOG.md \
            --output /tmp/kzcoder-changelog.md

      - name: Render updates feed into README
        run: |
          python3 - <<'PY'
          import html
          import re
          from pathlib import Path

          def compact(value, limit=300):
              value = re.sub(r'\s+', ' ', value).strip()
              return value if len(value) <= limit else value[:limit - 1].rstrip() + '…'

          def kazer_entries(text):
              match = re.search(r'^## \[Unreleased\]\s*(.*?)(?=^## |\Z)', text, re.M | re.S)
              if not match:
                  return []
              entries = []
              for raw in re.findall(r'^-\s+(.*)$', match.group(1), re.M)[:3]:
                  date = re.search(r'Pesquisa de (\d{1,2})/10/2026', raw)
                  label = f"{date.group(1).zfill(2)}.10.2026" if date else "UNRELEASED"
                  entries.append((label, compact(raw)))
              return entries

          def kzcoder_entries(text):
              entries = []
              sections = re.finditer(
                  r'^## \[([^]]+)\](?: - (\d{4}-\d{2}-\d{2}))?\s*(.*?)(?=^## |\Z)',
                  text, re.M | re.S
              )
              for section in sections:
                  version, date, body = section.groups()
                  if version == 'Unreleased':
                      continue
                  bullets = re.findall(r'^-\s+(.*)$', body, re.M)
                  label = date.replace('-', '.') if date else 'UNDATED'
                  entries.append((f"{label} / {version}", [compact(x) for x in bullets[:3]]))
                  if len(entries) == 2:
                      break
              return entries

          kazer = kazer_entries(Path('/tmp/kazer-changelog.md').read_text(errors='replace'))
          kzcoder = kzcoder_entries(Path('/tmp/kzcoder-changelog.md').read_text(errors='replace'))
          if not kazer and not kzcoder:
              raise SystemExit('No public changelog entries found; refusing to erase the feed.')

          blocks = []
          if kazer:
              body = '\n'.join(f'- {text}' for _, text in kazer)
              blocks.append(
                  '<details>\n'
                  '<summary><strong>' + kazer[0][0] + ' / KAZER / PUBLIC CHANGELOG</strong></summary>\n\n'
                  + body + '\n\n</details>'
              )
          if kzcoder:
              for label, bullets in kzcoder:
                  body = '\n'.join(f'- {text}' for text in bullets)
                  blocks.append(
                      '<details>\n'
                      '<summary><strong>' + label + ' / KZCODER / PUBLIC CHANGELOG</strong></summary>\n\n'
                      + body + '\n\n</details>'
                  )
          blocks.append(
              '[read KAZER changelog](https://github.com/jeanvicenc4/KAZER/blob/main/CHANGELOG.md) · '
              '[read Kzcoder changelog](https://github.com/jeanvicenc4/Kzcoder/blob/main/CHANGELOG.md)\n\n'
              '<sub>Feed generated by GitHub Actions from the public changelogs. No generated claims.</sub>'
          )
          feed = '\n\n'.join(blocks)

          readme = Path('README.md').read_text()
          start, end = '<!-- UPDATES:START -->', '<!-- UPDATES:END -->'
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit('Expected exactly one updates marker pair.')
          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          Path('README.md').write_text(before + start + '\n' + feed + '\n' + end + after)
          PY

      - name: Commit feed when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then
            echo "Product updates feed unchanged"
          else
            git commit -m "chore(profile): refresh product updates feed"
            git push
          fi
