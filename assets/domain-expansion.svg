<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Domain Expansion: Code Mode</title><desc id="desc">Cena original de batalha: figura abstrata em um domínio de código, rodeada por energia digital vermelha e branca.</desc>
<defs><radialGradient id="void"><stop stop-color="#351014"/><stop offset=".55" stop-color="#111113"/><stop offset="1" stop-color="#050506"/></radialGradient><linearGradient id="slash"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff"/><stop offset=".52" stop-color="#ef4444"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient><filter id="bloom"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="matrix" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M0 42V0H42" fill="none" stroke="#fff" stroke-opacity=".07"/><text x="6" y="16" fill="#ef4444" fill-opacity=".19" font-family="monospace" font-size="10">01</text></pattern></defs>
<style>.ring{transform-origin:500px 184px;animation:rotate 18s linear infinite}.aura{transform-origin:500px 184px;animation:breathe 2.4s ease-in-out infinite}.slash{animation:cut 3.2s ease-in-out infinite}.spark{animation:blink 1.6s steps(2) infinite}.lift{animation:lift 3s ease-in-out infinite alternate}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.045);opacity:.45}}@keyframes cut{0%,20%{opacity:0;transform:translateX(-400px)}35%{opacity:1}55%,100%{opacity:0;transform:translateX(500px)}}@keyframes blink{50%{opacity:.18}}@keyframes lift{to{transform:translateY(-8px)}}</style>
<rect width="1000" height="360" rx="18" fill="url(#void)"/><rect width="1000" height="360" rx="18" fill="url(#matrix)"/><g fill="none" stroke="#ef4444" stroke-opacity=".5"><circle class="ring" cx="500" cy="184" r="140" stroke-width="1" stroke-dasharray="3 10"/><circle class="aura" cx="500" cy="184" r="112" stroke-width="2"/><circle cx="500" cy="184" r="82" stroke="#fff" stroke-opacity=".22" stroke-dasharray="2 8"/></g>
<g class="lift" filter="url(#bloom)"><path d="M462 242l10-67 28-32 28 32 10 67-28 19h-20z" fill="#0b0b0d" stroke="#f4f4f5" stroke-width="2"/><path d="M469 177l31-27 31 27-13 16h-36z" fill="#171719" stroke="#ef4444" stroke-width="2"/><path d="M479 200h42M482 216h36" stroke="#fff" stroke-width="2" opacity=".65"/><path d="M448 250l-36 28M552 250l36 28" stroke="#ef4444" stroke-width="5"/></g>
<g fill="#fff" filter="url(#bloom)"><path class="spark" d="M314 103h5v5h-5zM673 84h4v4h-4zM704 250h5v5h-5zM288 231h3v3h-3zM612 59h4v4h-4z"/></g><path class="slash" d="M110 270L830 74" stroke="url(#slash)" stroke-width="12" filter="url(#bloom)"/><path d="M101 288L824 91" stroke="#fff" stroke-opacity=".42" stroke-width="1"/>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><text x="42" y="48" fill="#ef4444" font-size="13" letter-spacing="4">DOMAIN EXPANSION / CODE MODE</text><text x="42" y="320" fill="#f4f4f5" font-size="13" letter-spacing="3">CURSED ENERGY: COMPILE</text><text x="780" y="320" fill="#a1a1aa" font-size="11" letter-spacing="2">IDEA → BUILD → SHIP</text><text x="855" y="48" fill="#a1a1aa" font-size="11" letter-spacing="2">SYSTEM / ACTIVE</text></g><rect x="9" y="9" width="982" height="342" rx="13" fill="none" stroke="#fff" stroke-opacity=".18"/>
</svg>
